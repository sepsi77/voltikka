# Kamal deployment of Voltikka production on the Breezily VPS (tasks/vps-migration/,
# cutover-plan.md). Server runbook: github.com/sepsi77/breezily-infra.
#
# Deploy an existing immutable GHCR tag (built by scripts/build-and-push-image.sh); Kamal never
# builds this image:
#   kamal deploy --skip-push --version deploy-NNNNNN-<sha12>
#
# Production settings equal the Railway web service (2026-11-15): GTM, PostFast key, backups to
# the GCS bucket breezily-voltikka-backups, Sentry environment production. Mail goes to the log and
# daily spot social posts stay off, as on Railway.
service: voltikka
image: sepsi77/voltikka

servers:
  # FrankenPHP + schedule:work + queue:work (supervisord), as on Railway. Kamal starts the new
  # container before it stops the old one, so two schedulers can overlap for some seconds
  # during a web deploy; phase 2 moves the scheduled jobs to Temporal.
  web:
    hosts:
      - breezily-vps
    stop_timeout: 60
    options:
      memory: 4g
      volume: voltikka-storage:/app/storage
    env:
      clear:
        # Phase 2 groups that Temporal runs, so routes/console.php skips them. Web role only: a
        # typo then stops only the new web container. Change it only with the runbook in
        # tasks/vps-migration/decisions.md (deploy web, check schedule:list, then --apply --group).
        TEMPORAL_SCHEDULE_GROUPS: collectors
  # Temporal Python worker (docker-worker-entrypoint.sh). No proxy. It mounts the same storage
  # volume as the web role (one host), so the jobs that move to it in phase 2 see the same files
  # (S model files, backup temp) as the web role. The image HEALTHCHECK probes the web port, so
  # this role replaces it: the worker writes /tmp/voltikka-worker-ready after its Temporal client
  # has connected (worker.py READY_FILE). Kamal waits for "healthy" (deploy_timeout) before it
  # stops the old worker; a new worker that never connects is stopped and the old one keeps
  # running. The stop timeout is longer than the 65-minute GRACEFUL_SHUTDOWN of the worker, so
  # claim-based steps can finish.
  worker:
    hosts:
      - breezily-vps
    stop_timeout: 3960
    options:
      entrypoint: /usr/local/bin/docker-worker-entrypoint.sh
      # The second test keeps rollbacks to images without READY_FILE (deploy-000027 and older)
      # possible: their worker never writes the file, so they count as healthy, as before.
      health-cmd: "test -f /tmp/voltikka-worker-ready || ! grep -q READY_FILE /opt/orchestration/src/voltikka_orchestration/worker.py"
      health-start-period: 120s
      health-start-interval: 2s
      health-interval: 30s
      health-timeout: 3s
      health-retries: 3
      memory: 2g
      volume: voltikka-storage:/app/storage
    env:
      clear:
        TEMPORAL_ADDRESS: voltikka-prod-vps.lw6f1.tmprl.cloud:7233
        TEMPORAL_NAMESPACE: voltikka-prod-vps.lw6f1
        # Own S model files on the storage volume, not in the production voltikka-forecast bucket.
        FORECAST_STORE_DIR: /app/storage/app/forecast-models
      secret:
        - TEMPORAL_API_KEY

ssh:
  user: deploy

registry:
  server: ghcr.io
  username: sepsi77
  password:
    - KAMAL_REGISTRY_PASSWORD

# Required by Kamal; deploys always use --skip-push with a tag from build-and-push-image.sh.
builder:
  arch: amd64

# Cloudflare Tunnel ends TLS and sends traffic to kamal-proxy on the server (127.0.0.1:80). The
# tunnel takes every host; the voltikka.fi DNS record (CNAME to the tunnel, proxied) selects it.
proxy:
  host: voltikka.fi
  app_port: 8000
  ssl: false
  response_timeout: 120
  healthcheck:
    path: /up
    interval: 5
    timeout: 5

# The web start runs migrations and contracts:warm-cache before FrankenPHP starts.
deploy_timeout: 1200
retain_containers: 3

env:
  clear:
    APP_NAME: Voltikka
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: https://voltikka.fi
    LOG_CHANNEL: stack
    LOG_STACK: single,sentry_logs
    SENTRY_ENVIRONMENT: production
    SENTRY_ENABLE_LOGS: "true"
    SENTRY_TRACES_SAMPLE_RATE: "0.0"
    SENTRY_PROFILES_SAMPLE_RATE: "0.0"
    DB_CONNECTION: mysql
    DB_HOST: voltikka-db
    DB_PORT: "3306"
    DB_DATABASE: voltikka
    DB_USERNAME: voltikka
    DB_QUEUE_RETRY_AFTER: "450"
    CACHE_STORE: redis
    REDIS_HOST: voltikka-redis
    REDIS_PORT: "6379"
    # The pricing flags are part of the cache keys: keep them equal to Railway production.
    CANONICAL_PRICING_ENABLED: "true"
    RESET_FORWARD_SHIFT_ENABLED: "true"
    CONTRACT_STATISTICS_ANNUAL_METHOD_VERSION: annual_cost_as_of_v3
    CONTRACT_INTERPRETATION_ENABLED: "true"
    CONTRACT_INTERPRETATION_MAX_REPAIR_ATTEMPTS: "2"
    CONTRACT_INTERPRETATION_MODEL: openai/gpt-5.6-luna
    CONTRACT_INTERPRETATION_REASONING_EFFORT: medium
    # spatie/laravel-backup to GCS through its S3 API (HMAC key of the service account
    # voltikka-backup, object access to this bucket only). The bucket has fine-grained access
    # control on purpose: Flysystem sends an object ACL on every write, and GCS refuses any ACL
    # when uniform bucket-level access is on. Public access prevention is enforced.
    BACKUP_DISK: s3
    AWS_ENDPOINT: https://storage.googleapis.com
    AWS_DEFAULT_REGION: auto
    AWS_BUCKET: breezily-voltikka-backups
    AWS_USE_PATH_STYLE_ENDPOINT: "true"
    BACKUP_NAME: Voltikka
    BACKUP_FILENAME_PREFIX: voltikka-
    BACKUP_MAX_STORAGE_MB: "10000"
    # The container ID is public (it is in every page).
    GTM_CONTAINER_ID: GTM-T6BLZDB7
    MAIL_MAILER: log
    SPOT_SOCIAL_PUBLISHING_ENABLED: "false"
  secret:
    - APP_KEY
    - DB_PASSWORD
    - ENTSOE_API_KEY
    - FINGRID_API_KEY
    - GIE_API_KEY
    - OPENROUTER_API_KEY
    - DIGITRANSIT_API_KEY
    - SENTRY_LARAVEL_DSN
    - POSTFAST_API_KEY
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - BACKUP_ARCHIVE_PASSWORD

accessories:
  # Not published on the host: only containers on Kamal's Docker network can connect, as
  # voltikka-db:3306. Same major version as Railway (9.7). The server backup (01:30) dumps it.
  db:
    image: mysql:9.7
    host: breezily-vps
    cmd: --innodb-buffer-pool-size=1G --disable-log-bin --performance-schema=0 --max-allowed-packet=256M
    options:
      memory: 3g
    env:
      clear:
        MYSQL_DATABASE: voltikka
        MYSQL_USER: voltikka
      secret:
        - MYSQL_PASSWORD
        - MYSQL_ROOT_PASSWORD
    volumes:
      - voltikka-db:/var/lib/mysql
  # Shared Laravel cache and locks (phase 2 R2). noeviction: Laravel locks have a TTL, so an
  # LRU policy could remove an active lock when Redis is full; a full Redis must fail writes
  # visibly instead. Expired entries still go away. Append-only file, so a restart does not
  # empty the price cache.
  redis:
    image: redis:8
    host: breezily-vps
    cmd: redis-server --maxmemory 2gb --maxmemory-policy noeviction --appendonly yes --save ""
    options:
      memory: 2560m
    volumes:
      - voltikka-redis:/data
