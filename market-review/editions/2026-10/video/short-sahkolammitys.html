<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Short · Sähkölämmitteinen talo: pörssi vai kiinteä?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="../../../../videos/monthly-market-review/lib.css">
<link rel="stylesheet" href="../../../../videos/monthly-market-review/short.css">
<style>
  .ledger .row .k, .ledger .row .v { font-size: 42px; }
  .ledger .row .k small { display: block; font: 600 28px/1.3 var(--font-sans); color: var(--color-ink-muted); letter-spacing: 0; margin-top: 6px; }
  .season-box .h-3 { font-size: 36px; margin-top: 8px; }
  .season-box .label { font-size: 26px; margin-top: 8px; }
</style>
</head>
<body>

<!-- Hook: the house and the question, on screen from frame 0. -->
<section class="scene paper" id="sc-hook">
  <img class="abs" id="hook-house" src="../../../../design/illustrations/home-house-v1.png" alt="" style="left:170px; top:190px; width:740px">
  <div class="abs" style="left:64px; top:900px; width:940px">
    <div class="kicker" style="font-size:28px">Sähkölämmitteinen pientalo</div>
    <div class="h-hero" style="font-size:108px; margin-top:22px">Pörssisähkö vai kiinteä hinta?</div>
    <div class="lead" style="margin-top:22px">noin 11 100 kWh vuodessa</div>
  </div>
</section>

<!-- The monthly bill chart: winter, then the rest of the year. -->
<section class="scene paper" id="sc-chart">
  <div class="abs" id="chart-wrap" style="left:40px; top:250px; width:1000px">
    <div class="kicker" style="margin-left:24px">Arvioitu lasku kuukaudessa, €</div>
    <div class="caption" style="margin:12px 0 22px 24px; line-height:1.7" id="chart-legend"></div>
  </div>
  <div class="abs season-box" id="box-winter" style="left:64px; top:1020px; width:450px"></div>
  <div class="abs season-box" id="box-rest" style="left:550px; top:1020px; width:420px"></div>
</section>

<!-- The advice. -->
<section class="scene paper" id="sc-verdict">
  <div class="abs" style="left:64px; top:300px" id="verdict"><div class="stamp"><b>Neuvomme</b><span style="font-size:70px">Pörssisähkö on halvempi,<br>talvi on sille riski</span></div></div>
  <div class="abs ledger" id="why" style="left:64px; top:640px; width:940px"></div>
</section>

<!-- If you want a fixed price: 24 months, and the cheapest contracts. -->
<section class="scene paper" id="sc-fixed">
  <div class="abs" style="left:64px; top:250px; width:940px">
    <div class="kicker">Jos haluat kiinteän hinnan</div>
    <div class="h-hero" style="font-size:120px; margin-top:16px">24 kuukautta</div>
    <div class="lead" id="fixed-why" style="margin-top:26px">Kattaa kaksi talvea. Mediaanihinta 24 kk 10,90 c/kWh, 12 kk 12,00 c/kWh.</div>
  </div>
  <div class="abs ledger" id="contracts" style="left:64px; top:800px; width:940px"></div>
</section>

<section class="scene" id="sc-out"></section>

<script src="timeline/short-sahkolammitys.js"></script>
<script src="data.js"></script>
<script src="../../../../videos/monthly-market-review/lib.js"></script>
<script src="../../../../videos/monthly-market-review/short.js"></script>
<script>
const END = TL.total;
const T = { chart: S('k_be02_2') - 0.2, verdict: S('k_be02_4') - 0.2, fixed: S('k_be02_5') - 0.2, out: S('k_out1') - 0.3 };
scene('sc-hook', 0, T.chart, { fadeIn: 0 });
scene('sc-chart', T.chart, T.verdict, { wipe: true, z: 2 });
scene('sc-verdict', T.verdict, T.fixed, { wipe: true, z: 3 });
scene('sc-fixed', T.fixed, T.out, { wipe: true, z: 4 });
scene('sc-out', T.out, END + 1, { z: 5 });
shortMark(-1, T.out);
captions({ skip: ['sh_be02_0', 'k_out1'], strong: ['150', '190', '225', '75', 'halvempi', 'riski', 'varmuuden', '24'] });

// ---------- Hook ----------
drift($('#hook-house'), 0, T.chart, { from: 1.0, to: 1.05, oy: '80%' });

// ---------- Chart (Katsaus kuva 1, same data and look; shorter month labels for the narrow chart) ----------
{
    const g = D.groups.BE02;
    const c = billChart('BE02', { w: 1000, h: 640, labels: ['marr.', 'joulu', 'tammi', 'helmi', 'maal.', 'huhti', 'touko', 'kesä', 'heinä', 'elo', 'syys', 'loka'] });
    $('#chart-wrap').appendChild(c.node);
    $('#chart-legend').innerHTML = legend([[COL.spot, 'Pörssisähkö, tyypillinen sopimus'], [COL.fixed, '12 kk kiinteä, mediaani'], ['whisker', 'Kolmen talven säävaihtelu']]);
    c.grow(T.chart + 0.4, 1.4);
    c.mark('winter', S('k_be02_2') + 0.3, S('k_be02_3'));
    c.mark('rest', S('k_be02_3') + 0.3);
    $('#box-winter').innerHTML = `<div class="kicker" style="color:var(--color-lake)">Marras–maalis</div><div class="h-3">pörssi ${fi(g.winter.spot_eur_mean)} €<br>kiinteä ${fi(g.winter.fixed_eur_mean)} €</div><div class="label">Pörssisähkö noin 150 € kalliimpi, kylmänä talvena noin 190 €</div>`;
    $('#box-rest').innerHTML = `<div class="kicker" style="color:#6B4A00">Huhti–loka</div><div class="h-3">pörssi ${fi(g.rest.spot_eur_mean)} €<br>kiinteä ${fi(g.rest.fixed_eur_mean)} €</div><div class="label">Kiinteä noin 225 € kalliimpi. Koko vuonna pörssi noin 75 € halvempi</div>`;
    show($('#box-winter'), A('k_be02_2', 0.3), { dy: 20 });
    show($('#box-rest'), A('k_be02_3', 0.2), { dy: 20 });
}

// ---------- Verdict ----------
stamp($('#verdict'), T.verdict + 0.5, -2);
[[COL.spot, 'Pörssisähkö', 'pitkällä aikavälillä halvempi', 'noin 75 € / v', 0.12], [COL.fixed, 'Kiinteä hinta', 'varmuus talven laskusta, kesällä kalliimpi', '+225 € kesällä', 0.6]].forEach(([c, k, d, v, f]) => {
    const r = el(`<div class="row"><span class="dot" style="background:${c}; align-self:center"></span><span class="k">${k}<small>${d}</small></span><span class="v">${v}</span></div>`);
    $('#why').appendChild(r);
    show(r, A('k_be02_4', f), { dy: 24 });
});

// ---------- Fixed: 24 months and the cheapest contracts (first year, energy + electricity tax) ----------
show($('#fixed-why'), A('k_be02_5', 0.3), { dy: 20 });
{
    const led = $('#contracts');
    led.appendChild(el(`<div class="kicker" style="color:var(--color-ink-muted); margin-bottom:6px">Ensimmäinen vuosi, energia + sähkövero</div>`));
    [['Pohjois-Karjalan Sähkö', 'Optimi takuu 24 kk · edullisin 24 kk', 'noin 1 500 €', 0.05, COL.fixed], ['Herrfors', 'Spot+ · edullisin pörssisähkö', '1 564 €', 0.55, COL.spot]].forEach(([seller, prod, eur, d, c]) => {
        const r = el(`<div class="row"><span class="dot" style="background:${c}; align-self:center"></span><span class="k">${seller}<small>${prod}</small></span><span class="v">${eur}</span></div>`);
        led.appendChild(r);
        show(r, A('k_be02_6', d), { dy: 24 });
    });
    show(led.firstElementChild, S('k_be02_6'), { dy: 10 });
}

// ---------- End card ----------
shortEnd('sc-out', T.out, END, {
    plate: '../../../../design/scenes/winter-evening-village-v2.png',
    head: 'Laske hinnat omalla kulutuksellasi',
    sub: 'Koko katsaus: voltikka.fi/markkinakatsaus',
});
</script>
</body>
</html>
