<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Sähkömarkkinakatsaus · lokakuu 2026 · Numerot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="../../../../videos/monthly-market-review/lib.css">
<style>
  .card { position: absolute; inset: 0; display: none; }
  .card .wrap { position: absolute; left: 150px; top: 270px; width: 1640px; }
  .card .count { position: absolute; right: 120px; top: 70px; font: 800 30px/1 var(--font-display); letter-spacing: -0.01em; }
  .card .count b { font-size: 64px; letter-spacing: -0.03em; }
  .card .big { font: 800 400px/0.92 var(--font-display); letter-spacing: -0.05em; white-space: nowrap; transform-origin: 0 80%; }
  .card .big small { font-size: 110px; letter-spacing: -0.03em; margin-left: 24px; }
  .card .cap { font: 800 64px/1.08 var(--font-display); letter-spacing: -0.025em; margin-top: 40px; max-width: 1500px; }
  .card .sub { font: 500 32px/1.35 var(--font-sans); margin-top: 22px; max-width: 1500px; }
  .card.dark { background: var(--color-night); color: #fff; }
  .card.dark .sub { color: var(--color-night-lead); }
  .card.dark .kicker { color: #F2B48F; }
  .card.light .sub { color: var(--color-ink-body); }
  .card .ul { position: absolute; left: 0; width: 620px; height: 30px; overflow: visible; }
  .card .ul path { fill: none; stroke-width: 12; stroke-linecap: round; }
  .progress { position: absolute; left: 150px; right: 150px; bottom: 70px; height: 6px; display: flex; gap: 12px; z-index: 60; }
  .progress i { flex: 1; background: rgb(127 140 160 / 0.35); border-radius: 3px; overflow: hidden; }
  .progress i b { display: block; height: 100%; width: 0; background: var(--color-fox); }
</style>
</head>
<body>

<section class="scene night" id="sc-title">
  <img class="plate" id="title-plate" src="../../../../design/scenes/night-sky-plate-v1.png" alt="" style="opacity:0.7">
  <div class="abs" style="left:150px; top:200px; width:1640px">
    <div class="wm" style="position:static; display:flex; align-items:center; gap:14px" id="title-logo"><span style="font:800 44px/1 var(--font-display); color:#fff">Voltikka</span></div>
    <div class="kicker" style="margin-top:70px; font-size:28px">Sähkömarkkinakatsaus · lokakuu 2026</div>
    <div style="font:800 200px/0.95 var(--font-display); letter-spacing:-0.045em; margin-top:26px">Lokakuu<br><span style="color:#FF9E7A">18 numerossa</span></div>
  </div>
</section>

<div id="cards"></div>

<section class="scene paper" id="sc-sum">
  <div class="abs" style="left:150px; top:170px"><div class="kicker">Neuvomme</div><div class="h-1" style="margin-top:12px">Tänä talvena</div></div>
  <div class="abs" id="sum1" style="left:150px; top:420px; display:flex; align-items:center; gap:50px"><img src="../../../../design/illustrations/home-house-v1.png" style="width:300px"><div class="stamp"><b>Sähkölämmitteinen pientalo</b><span>24 kk kiinteä hinta nyt</span></div></div>
  <div class="abs" id="sum2" style="left:150px; top:720px; display:flex; align-items:center; gap:50px"><img src="../../../../design/illustrations/home-apartment-v1.png" style="width:300px"><div class="stamp"><b>Kerrostaloasunto</b><span>Pysy pörssisähkössä</span></div></div>
</section>

<section class="scene" id="sc-out">
  <img class="plate" id="out-plate" src="../../../../design/scenes/winter-evening-village-v2.png" alt="">
  <div style="position:absolute; inset:0; background:rgb(20 33 58 / 0.35)"></div>
  <div class="abs" id="out-card" style="left:180px; top:200px; width:820px; padding:56px 64px 60px; background:var(--paper); clip-path:polygon(12% 0, 88% 0, 100% 8%, 100% 100%, 0 100%, 0 8%)">
    <div style="display:flex; align-items:center; gap:16px" id="out-logo"><span style="font:800 80px/1 var(--font-display); letter-spacing:-0.02em">Voltikka</span></div>
    <div class="h-2" style="margin-top:56px">Laske hinnat omalla kulutuksellasi</div>
    <div class="num" style="font-size:96px; color:var(--color-fox-deep); margin-top:26px">voltikka.fi</div>
  </div>
  <img class="abs" id="out-fox" src="../../../../design/mascot/fox-sit-skyward-v1.png" alt="" style="left:1300px; top:560px; width:470px">
</section>

<div class="progress" id="progress"></div>

<script src="timeline/numerot.js"></script>
<script src="data.js"></script>
<script src="../../../../videos/monthly-market-review/lib.js"></script>
<script>
const END = TL.total;
$('#title-logo').insertAdjacentHTML('afterbegin', LOGO(52));
$('#out-logo').insertAdjacentHTML('afterbegin', LOGO(72));

// The fourteen numbers. tone: dark (night) or light (paper); c: number colour.
const AU = 'var(--color-aurora)', HI = 'var(--color-price-high)', FX = 'var(--color-fox-deep)';
const N = [
    ['n_1', 'Lokakuu', 'dark', '#fff', '4,77<small>c/kWh</small>', 'Pörssisähkön keskihinta lokakuussa', 'alv 25,5 % · ENTSO-E', '#7FD6B5'],
    ['n_2', 'Lokakuu', 'light', AU, '−33 %', 'halvempaa kuin syyskuussa', 'syyskuu 7,15 → lokakuu 4,77 c/kWh · vuodentakaisesta −22 %'],
    ['n_3', 'Lokakuu', 'dark', '#7FD6B5', '+23 %', 'tuulivoimaa vuodentakaisesta', '2,83 TWh lokakuussa · kapasiteetti 9 553 MW'],
    ['n_4', 'Lokakuu', 'light', FX, '+2,9 °C', 'tavallista lämpimämpi lokakuu', 'lämmitystarve 75 % normaalista (1991–2020)'],
    ['n_5', 'Lokakuu', 'dark', '#FF9E7A', '46,5 %', 'ydinvoimasta käytössä', 'Olkiluoto 3 vuosihuollossa koko kuun, Loviisa 1 ja 2 osan kuusta'],
    ['n_oct30', 'Lokakuu', 'light', HI, '18,6<small>c/kWh</small>', 'lokakuun kallein päivä, 30.10.', 'tuuli tyyntyi ja Olkiluoto 1 oli vuorokauden pois verkosta'],
    ['n_6', 'Talvi', 'light', HI, '15,7<small>c/kWh</small>', 'tammikuun futuuri', 'EEX, Finnish Power Base, 30.10.2026, alv 25,5 % · yli kolme kertaa lokakuun hinta'],
    ['n_7', 'Talvi', 'dark', '#9CC3EA', '−13<small>%-yks.</small>', 'Norjan vesialtaat tavallista vajaammat', '69,5 % täynnä, tavallisesti 82,6 % (NVE, viikko 43)'],
    ['n_8', 'Talvi', 'light', 'var(--color-ink)', '11.11.', 'Olkiluoto 3 palaa vuosihuollosta', 'Euroopan kaasuvarastot 74,6 % (vuosi sitten 82,8 %)'],
    ['n_9', 'Talvi', 'dark', '#FF9E7A', '51<small>c/kWh</small>', 'pörssisähkö maanantaina 2.11. illalla', 'tuulivoimaa kolmannes lokakuun tasosta · päivän keskihinta 26 c/kWh'],
    ['n_10', 'Talvi', 'light', HI, '~34<small>c/kWh</small>', 'koko viikon, jos talvi on kylmä ja tyyni', 'kuten tammikuussa 2024 · pahin riski'],
    ['n_11', 'Mitä valita', 'dark', '#fff', '1 495 €', 'edullisin 24–36 kk kiinteä hinta, 1. vuosi', 'sähkölämmitteinen pientalo · Cheap Määräaikainen 36 kk, Pohjois-Karjalan Sähkö Optimi takuu 24 kk · edullisin pörssisähkö Herrfors Spot+ 1 564 €'],
    ['n_12', 'Mitä valita', 'light', HI, '+225 €', '12 kk kiinteä hinta huhti–lokakuussa', 'sähkölämmitteinen pientalo, pörssisähköön verrattuna · talvella kiinteä on noin 150 € halvempi'],
    ['n_flex', 'Mitä valita', 'light', AU, '77 €', 'vuodessa säästöä kulutusjoustolla', 'sähkölämmitteinen pientalo pörssisähköllä · automatiikka siirtää noin 900 kWh halvoille tunneille'],
    ['n_apt', 'Mitä valita', 'dark', '#7FD6B5', '40 €', 'pörssisähkö kiinteää halvempi vuodessa', 'kerrostaloasunto · kallein talviviikko noin 30 € · edullisin: Nordic Green Energy Pörssisähkö'],
    ['n_13', 'Mitä valita', 'dark', '#9CC3EA', '+155 €', 'kvartaalisähkö tammi–maaliskuussa', 'sähkölämmitteinen pientalo · hinta nousee 1.1. noin 3,8 c/kWh · vaihda kiinteään ennen vuodenvaihdetta'],
    ['n_14', 'Sopimukset', 'dark', '#FF9E7A', '+36 %', 'myyjien energiahinnat toukokuun pohjalta', 'Voltikan hintaindeksi 13,27 c/kWh · lokakuussa +3,7 %, vaikka pörssisähkö halpeni'],
    ['n_terms', 'Sopimukset', 'light', AU, '10,9<small>c/kWh</small>', '24 kk sopimusten mediaanihinta', '6 kk sopimukset 14,9 c/kWh: puolen vuoden sopimus kattaa lähes pelkkää talvea · mediaanit 2.11.'],
];
const cards = $('#cards');
const UL = '<svg class="ul" viewBox="0 0 620 30" preserveAspectRatio="none"><path pathLength="1" d="M6 18 C 120 6, 220 28, 330 14 S 520 8, 614 16"/></svg>';
// Dark and light cards alternate; a colour written for the other tone is mapped to this one.
const TO_DARK = { [HI]: '#FF9E7A', [AU]: '#7FD6B5', [FX]: '#FF9E7A', 'var(--color-ink)': '#fff' };
const TO_LIGHT = { '#fff': 'var(--color-ink)', '#7FD6B5': AU, '#FF9E7A': HI, '#9CC3EA': 'var(--color-lake)' };
N.forEach(([line, kick, tone0, c0, big, cap, sub, ulc], i) => {
    const tone = i % 2 ? 'light' : 'dark';
    const c = tone === tone0 ? c0 : (tone === 'dark' ? TO_DARK : TO_LIGHT)[c0] || c0;
    const node = el(`<section class="card ${tone} ${tone === 'light' ? 'paper' : ''}">
      <div class="count"><b>${String(i + 1).padStart(2, '0')}</b> / ${N.length}</div>
      <div class="wrap"><div class="kicker">${kick}</div><div class="big" style="color:${c}; margin-top:20px">${big}</div>${UL}<div class="cap">${cap}</div><div class="sub">${sub}</div></div></section>`);
    cards.appendChild(node);
    const t0 = S(line) - 0.15, t1 = i + 1 < N.length ? S(N[i + 1][0]) - 0.15 : S('n_sum') - 0.2;
    const bigEl = $('.big', node), path = $('.ul path', node), capEl = $('.cap', node), subEl = $('.sub', node);
    path.style.stroke = ulc || (tone === 'dark' ? '#C4501C' : '#C4501C');
    path.style.strokeDasharray = '1 1';
    tick((t) => {
        const on = t >= t0 && t < t1 + 0.8; // stays under the next card while it slides in
        node.style.display = on ? 'block' : 'none';
        node.style.zIndex = 10 + i;
        if (!on) return;
        // Whip in: the card slides up fast, the number lands with a small overshoot.
        const a = P(t, t0, 0.32, 'io');
        node.style.transform = `translateY(${(1 - a) * 1080}px)`;
        const b = P(t, t0 + 0.15, 0.5, 'back');
        bigEl.style.transform = `scale(${lerp(0.85, 1, b)})`;
        bigEl.style.opacity = clamp(b * 2);
        path.style.strokeDashoffset = 1 - P(t, t0 + 0.5, 0.6, 'io');
        capEl.style.opacity = P(t, t0 + 0.7, 0.4); capEl.style.transform = `translateY(${(1 - P(t, t0 + 0.7, 0.5)) * 30}px)`;
        subEl.style.opacity = P(t, t0 + 1.2, 0.5);
    });
});

const tSum = S('n_sum') - 0.2, tOut = S('k_out1') - 0.3;
scene('sc-title', 0, S('n_1') - 0.15, { fadeIn: 0 });
scene('sc-sum', tSum, tOut, { wipe: true, z: 40 });
scene('sc-out', tOut, END + 1, { z: 41, fadeOut: 0 });
drift($('#title-plate'), 0, S('n_1'), { from: 1.0, to: 1.08 });
show($('#sum1'), S('n_sum') + 0.2, { dy: 40 }); stamp($('#sum1'), S('n_sum') + 0.6);
show($('#sum2'), S('n_sum') + 4.6, { dy: 40 }); stamp($('#sum2'), S('n_sum') + 5.0);

// Progress rail: one segment per number.
const prog = $('#progress');
N.forEach(() => prog.appendChild(el('<i><b></b></i>')));
tick((t) => {
    prog.style.display = t >= S('n_1') - 0.15 && t < tSum ? 'flex' : 'none';
    $$('b', prog).forEach((b, i) => {
        const a = S(N[i][0]) - 0.15, z = i + 1 < N.length ? S(N[i + 1][0]) - 0.15 : tSum;
        b.style.width = `${clamp((t - a) / (z - a)) * 100}%`;
    });
});

drift($('#out-plate'), tOut, END, { from: 1.1, to: 1.0, oy: '60%' });
dropIn($('#out-card'), S('k_out1') + 0.1);
show($('#out-fox'), S('k_out1') + 1.1, { dx: 80, dy: 30, dur: 0.9 });
tick((t) => { $('#sc-out').style.opacity = 1 - P(t, END - 0.8, 0.8, 'lin'); });
</script>
</body>
</html>
