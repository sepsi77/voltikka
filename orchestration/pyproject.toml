[project]
name = "voltikka-orchestration"
version = "0.1.0"
description = "Temporal workers and workflows for Voltikka data pipelines (tasks/temporal-orchestration/)"
# 3.13 only: the S model package (../forecast) pins the frozen s_v1 runtime.
requires-python = ">=3.13,<3.14"
dependencies = [
    "temporalio==1.35.0",
    "sentry-sdk==2.74.0",
    # The own S model (tasks/temporal-orchestration/s-workflow-interface.md). The activities start
    # it as a child process (python -m voltikka_forecast.s); they never import it. Its exact pins
    # (numpy, pandas, scikit-learn, ...) are locked in uv.lock here too.
    "voltikka-forecast",
]

[tool.uv.sources]
voltikka-forecast = { path = "../forecast", editable = false }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voltikka_orchestration"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
