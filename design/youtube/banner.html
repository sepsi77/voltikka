<!doctype html>
<!--
  Voltikka YouTube channel banner, 2560 × 1440. The painted scene is src/banner-scene-v3.png;
  this page adds the wordmark and the message inside the YouTube safe area
  (1546 × 423, centred: x 507–2053, y 508–931).
  Render: cd videos && node render.mjs ../design/youtube/banner.html --size 2560x1440 --stills 0 --out <scratch>/banner.mp4,
  then save the PNG as voltikka-youtube-banner.jpg (YouTube limit 6 MB).
  See design/AGENTS.md.
-->
<html lang="fi">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@700&display=block">
<style>
  html, body { margin: 0; width: 2560px; height: 1440px; overflow: hidden; background: #14213A; }
  /* The scene is 110 % (2816 × 1584) and moved up and left, so the whole fox is in the safe area. */
  .scene { position: absolute; left: -256px; top: -144px; width: 2816px; height: 1584px; }
  /* A soft local shade keeps the text at 4.5:1 or better on the sky. */
  .shade {
    position: absolute; left: 380px; top: 470px; width: 1200px; height: 500px;
    background: radial-gradient(ellipse at 40% 50%, rgba(20,33,58,.55) 0%, rgba(20,33,58,0) 70%);
  }
  .copy { position: absolute; left: 580px; top: 560px; display: flex; flex-direction: column; gap: 22px; }
  .wordmark { display: flex; align-items: center; gap: 26px; }
  .wordmark span {
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;
    font-size: 150px; line-height: 150px; letter-spacing: -0.035em; color: #FFFFFF;
  }
  .message {
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;
    font-size: 52px; line-height: 58px; letter-spacing: -0.02em; color: #FFFFFF;
  }
  .wave { display: block; margin-top: -6px; }
  .url {
    font-family: 'Figtree', sans-serif; font-weight: 700;
    font-size: 30px; line-height: 36px; color: #C9D3E3; letter-spacing: 0.01em;
  }
</style>
</head>
<body>
<img class="scene" src="src/banner-scene-v3.png" alt="">
<div class="shade"></div>
<div class="copy">
  <div class="wordmark">
    <svg width="140" height="140" viewBox="0 0 34 34" aria-hidden="true">
      <path d="M5 29 C 6 16, 14 7, 27 5 C 24 12, 22 20, 13 26 C 10 28, 7 29, 5 29 Z" fill="#C4501C"/>
      <path d="M27 5 C 25.5 9, 24.5 12, 22.5 15 C 21 12.5, 22.5 8, 27 5 Z" fill="#FFFFFF"/>
      <path d="M29.5 11.5 l1 2.2 2.2 1 -2.2 1 -1 2.2 -1 -2.2 -2.2 -1 2.2 -1 z" fill="#1C7A5E"/>
      <circle cx="31" cy="4" r="1.6" fill="#6A4C9C"/>
    </svg>
    <span>Voltikka</span>
  </div>
  <div>
    <div class="message">Löydä oikeasti halvin sähkösopimus.</div>
    <svg class="wave" width="860" height="14" viewBox="0 0 560 14" preserveAspectRatio="none" aria-hidden="true">
      <path d="M2 8 C 40 2, 80 13, 120 7 S 200 2, 240 8 S 320 13, 360 7 S 440 2, 480 8 S 540 12, 558 6"
            fill="none" stroke="#C4501C" stroke-width="5" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="url">voltikka.fi · kaikki Suomen sähkösopimukset</div>
</div>
</body>
</html>
