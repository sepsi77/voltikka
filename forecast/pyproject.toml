[project]
name = "voltikka-forecast"
version = "0.1.0"
description = "Voltikka own spot price forecast models; S model s_v1 (tasks/own-forecast-model-data/s-model-freeze.md)"
# The frozen runtime of s_v1: a fitted model is valid only with the same scikit-learn version.
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    # The rest of the research runtime (research/.venv, 2026-11-07), so that the fitted numbers
    # cannot move: scipy (Ridge solvers), joblib, threadpoolctl; tzdata because a slim Linux image
    # may have no system zone files and Europe/Helsinki sets every cut. python-dateutil stays
    # below 3 for botocore (research had 4.0.0; pandas parses the ISO dates of the model without
    # it); the production replay runs in this environment to prove the result.
    "scipy==1.18.1",
    "joblib==1.6.0",
    "threadpoolctl==3.7.0",
    "tzdata==2026.6",
    # Production I/O: MySQL (the Laravel DB_* variables) and the private archive bucket.
    "PyMySQL==1.2.3",
    "boto3==1.43.126",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voltikka_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
